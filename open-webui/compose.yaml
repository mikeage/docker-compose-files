---
services:
    openwebui:
        restart: unless-stopped
        image: ghcr.io/open-webui/open-webui:main@sha256:8b432fe0a65b91116afc7961365c6cca5379cc923171386a96691f3471f3cae9
        ports:
            - 3006:8080
        volumes:
            - /opt/open-webui/data:/app/backend/data
        labels:
            - traefik.enable=true
            - traefik.http.routers.open-webui.rule=Host(`open-webui.internal.mikeage.net`)
