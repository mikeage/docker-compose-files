---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:bffcd679cac5fe6ef23b1fccbe992dee6e8dfbd42393d25ed94dcb2da4ccbd27
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
