---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:deb31d41c5b91399ebb6bd3ceac97f5acd9ecd5fd9b2e2282c05c71fd531898c
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
