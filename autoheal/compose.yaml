---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:e5e3140d0b594f46214372280dbed680ec84e3af4e628803df5402247c780499
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
