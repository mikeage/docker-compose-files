---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:98ec1fed3c78ea8b28b55f172172511799d73dc4f024381944fd47935a486b84
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
