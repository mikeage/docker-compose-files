---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:feb5427b566b8652143fe8cdd43c07650f97f72618db282ed63a008e18202933
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
