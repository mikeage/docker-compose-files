---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:44f0df7f5133eff4446da638bb89aa04424fd8063d7ddebfa94a69a8e23f7f1f
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
