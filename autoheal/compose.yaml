---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:dd15dec4b2d33535ff7c78a70dc595b31c13de0d502bf4be440fb910745bab60
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
