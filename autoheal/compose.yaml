---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:9873b1ccafe441711f7f1f8e74ef64f67a549e96a6f027fe32f70c9b85ef0870
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
