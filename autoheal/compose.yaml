---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:aa7e65eef42543fa00770e1d36d1b44dd8869f160038c3ce423358dd7ac6d5f0
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
