---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:3fd4d591075224304e95d92af8619adda1fe6e1469587e8b5230d946b0926f00
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
