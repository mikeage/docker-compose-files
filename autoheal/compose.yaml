---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:16a5bff91774e81fe729191f661e511d19800cf96ab9be27fc9b3d3c628edca3
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
