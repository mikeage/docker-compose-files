---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:5898f4403aa3d32e967dbd527a017f49e9ef2e8a2a01cccc76135c2a0926b507
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
