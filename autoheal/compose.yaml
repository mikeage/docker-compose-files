---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:3468f3a280d61562ba96813930490716d9b30cf29382ec6cc01c9704df7beb30
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
