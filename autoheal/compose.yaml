---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:fabd95ee5ef63db77cb23edf0419148d6781f2bc32bd1a83c68dee3ec2fc49f0
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
