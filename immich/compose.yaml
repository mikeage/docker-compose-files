---
name: immich

services:
    immich-server:
        container_name: immich_server
        image: ghcr.io/immich-app/immich-server:v3.3.0@sha256:be56bc12c17a84617a979ad1eab1d9105bbec1955ffa7da09b3f9cf79d3bd09d
        volumes:
            - /export/storage/permanent/immich-library:/data
            - /export/storage/permanent/pictures:/pictures:ro
            - /etc/localtime:/etc/localtime:ro
        environment:
            TZ: Asia/Jerusalem
            DB_PASSWORD: ${DB_PASSWORD}
        ports:
            - 2283:2283
        depends_on:
            - redis
            - database
        restart: always
        healthcheck:
            disable: false
        devices:
            - /dev/dri:/dev/dri

    immich-machine-learning:
        container_name: immich_machine_learning
        image: ghcr.io/immich-app/immich-machine-learning:v3.3.0-openvino@sha256:a79670d05f8da90c86f8074afe1beaf51abee53c58692ad45cae2efd9afd4aca
        volumes:
            - model-cache:/cache
        restart: always
        healthcheck:
            disable: false
        device_cgroup_rules:
            - c 189:* rmw
        devices:
            - /dev/dri:/dev/dri

    redis:
        container_name: immich_redis
        image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
        healthcheck:
            test: redis-cli ping || exit 1
        restart: always

    database:
        container_name: immich_postgres
        image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
        environment:
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_USER: postgres
            POSTGRES_DB: immich
            POSTGRES_INITDB_ARGS: --data-checksums
            DB_STORAGE_TYPE: HDD
        volumes:
            - /opt/immich/postgres:/var/lib/postgresql/data
        shm_size: 128mb
        restart: always
        healthcheck:
            disable: false

volumes:
    model-cache:
