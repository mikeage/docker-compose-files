---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:786706780f67140c2fac237dee5014add684a3cf648da7cb343a12cef2e088cc
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
