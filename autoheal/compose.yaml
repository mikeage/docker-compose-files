---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:441b0264c5a57ab5f1bd9467cb8c155cd8ddac249d338a9ad4132d059e7d0877
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
