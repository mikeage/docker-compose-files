---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:3b9e862edb87c010d6f5ba65847e181830db1acc2a1d4b7c77d45620f8c95fa3
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
