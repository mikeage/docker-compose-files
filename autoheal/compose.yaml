---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:ece80898117672f615a5ef9e1a3bb66633d7ac05dbe0f1212556ccbfe97d8cfa
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
