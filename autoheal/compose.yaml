---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:cbbffc390b22fa7ad0f3f4e47df6bbb90a63a49636bb5899feb34ba3118a8932
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
