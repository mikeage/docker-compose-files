---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:25d91d29941138140dfd4363307a51176e56bf7347571e9cb72ea2599e65fe42
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
