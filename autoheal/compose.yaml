---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:94c43f4a2bc0634b2697ff215e8cd6cb947f88992129c09d412757cdb266d52e
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
