---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:c9773d33e6362cb9fd584f59bcae1c70334ff39b98a8223e3291af42eb18ddde
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
