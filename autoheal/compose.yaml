---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:84e074a95e8419db9e767cf095c992cc79c1b643773ffc61353be98b5be722e2
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
