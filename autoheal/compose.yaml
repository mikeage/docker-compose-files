---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:eca390018df1406538181eae23166c20d1ec303558396686e03dbbbf4b3df4e4
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
