---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:8668afd197cf266981caf6f464fffd2b4c2c6fca224f1655c44570ddc7409779
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
