---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:ba8e6ab448593fa248121d5ed21c682e40d061ab8bef29bc877806f2c548093a
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
