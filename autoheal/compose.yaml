---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:e3dcdab51f40f71458c280a3bca08d4a730bd9f265240fa8ed5fda72b31e98ee
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
