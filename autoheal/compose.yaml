---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:5d606ef64e3555b6ada0d1154bcb1eca674f043191a6a8fd184fef512afd31c4
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
