---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:5620c5f0e8376a9e0dec68e5aca06f026fedf838addf3684e186ff2e9a194518
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
