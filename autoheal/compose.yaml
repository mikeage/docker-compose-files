---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:9eb552aeeefb61712e4a17859cccbc29cb99f2627eba6d18c57318369f272ff7
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
