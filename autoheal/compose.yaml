---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:9e219dd595eef299a8306a19eed4bc7eee57c70428dd308b0ee1e093dc9a484b
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
