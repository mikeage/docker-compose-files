---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:0db22d575c4ffdb3c62dc3f449c39cb6ca6c510ec2dc06116839898cd17c6061
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
