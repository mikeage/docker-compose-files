---
services:
    seerr:
        image: ghcr.io/seerr-team/seerr:v3.4.0@sha256:d206d9e4056bb90178297df58047791196e7721e6dc19384579b0530702fe086
        init: true
        environment:
            - LOG_LEVEL=debug
            - TZ=Asia/Jerusalem
        ports:
            - 5055:5055
        volumes:
            - /opt/seerr/config:/app/config
        healthcheck:
            test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
            start_period: 20s
            timeout: 3s
            interval: 15s
            retries: 3
        restart: unless-stopped
        labels:
            - traefik.enable=true
            - traefik.http.routers.seerr.rule=Host(`seerr.internal.mikeage.net`)
