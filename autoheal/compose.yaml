---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:974646c10721e67d3f557626f6c626ba17a047c3d009e4015c780d71dcbe6794
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
