---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:231cfb9e28bb465ce654024ac0dd23852a3d163b7817e0635002b43419bc13c9
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
