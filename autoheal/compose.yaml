---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:c3dee32ad1199e942a895010a5d3ae88ed3fe5fc3d32212ac8b8d47d9e6b24ff
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
