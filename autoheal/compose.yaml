---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:184dff00097d87bdb85e60e5c2dd18cede3940f6cae539f6cbe123b964316939
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
