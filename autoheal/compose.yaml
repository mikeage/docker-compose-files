---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:d926d8bda96f5882ce7d937732d7e06ef04607b46914b875885d45f131576042
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
