---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:243a9d012d27996ed933a590c9ffb690c4dcf4e436d786d3680805fef3b26ee6
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
