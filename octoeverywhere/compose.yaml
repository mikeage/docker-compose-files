---
services:
    a1mini:
        restart: unless-stopped
        image: octoeverywhere/octoeverywhere:4.7.0@sha256:f429ac9d7082614268562c80b6b4c9e97f612971b43f0315b59899a089c33b4d
        environment:
            - ACCESS_CODE=39994545
            - SERIAL_NUMBER=0309DA462001807
            - PRINTER_IP=a1mini.lan
            - TZ=Asia/Jerusalem
        volumes:
            - /opt/octoeverywhere/a1mini:/data
        healthcheck:
            test: [CMD-SHELL, test -w /data && test -d /data/octoeverywhere-store && test -d /data/logs]
            start_period: 30s
            interval: 30s
            timeout: 5s
            retries: 3
