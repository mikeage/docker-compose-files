---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:c5819d4773640607339b2df25ae78dd634065b224580a1b80e5eceb8e43fb649
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
