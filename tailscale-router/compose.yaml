---
services:
    tailscale-router:
        image: tailscale/tailscale:v1.98.4@sha256:25cde9ad76020b0e29229136d0c38b5962e9a0e1774ffac9b0df68e4a37d6cf0
        hostname: ${TS_HOSTNAME:?set TS_HOSTNAME}
        network_mode: host
        restart: unless-stopped
        healthcheck:
            test: [CMD, tailscale, status]
            start_period: 20s
            interval: 30s
            timeout: 10s
            retries: 5
        cap_add:
            - NET_ADMIN
            - SYS_MODULE
        volumes:
            - /dev/net/tun:/dev/net/tun
            - /opt/tailscale/data:/var/lib/tailscale
        environment:
            - TS_EXTRA_ARGS=--login-server https://headscale.mikeage.net --accept-dns=true --advertise-exit-node --advertise-routes=192.168.0.0/16
            - TS_STATE_DIR=/var/lib/tailscale
            - TZ=Asia/Jerusalem
            - TS_HOSTNAME=${TS_HOSTNAME:?set TS_HOSTNAME}
