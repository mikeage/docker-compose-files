---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:74be4ffe861bb4d8ef414c504811094511be091343ea84e45537d9e5ea6284ea
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
