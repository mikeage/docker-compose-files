---
services:
    calibre-web:
        image: lscr.io/linuxserver/calibre-web:0.6.27@sha256:f9c692fba85ade1ce71b98364b860f72855055a59198894cc8c2ea49fc98a840
        healthcheck:
            test: [CMD-SHELL, "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8083; printf \"GET / HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\\
                      n\" >&3; grep -Eq \"HTTP/1\\\\.[01] (200|301|302)\" <&3'"]
            start_period: 300s
            interval: 30s
            timeout: 10s
            retries: 5
        environment:
            - TZ=Asia/Jerusalem
            - DOCKER_MODS=linuxserver/mods:universal-calibre
            - PUID=1000
            - PGID=1000
        volumes:
            - /opt/calibre-web/config:/config
            - ebooks:/books
        ports:
            - 8084:8083
        restart: unless-stopped
    calibre:
        image: lscr.io/linuxserver/calibre:9.18.0@sha256:5b5c0cba9fa70d65b5d92da73b8d486d4acf0d03ea648062586c4e3789700d89
        healthcheck:
            test: [CMD-SHELL, "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET / HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\\
                      n\" >&3; grep -Eq \"HTTP/1\\\\.[01] (200|301|302)\" <&3'"]
            start_period: 60s
            interval: 30s
            timeout: 10s
            retries: 5
        environment:
            - TZ=Asia/Jerusalem
            - PUID=1000
            - PGID=1000
            # - PASSWORD=${PASSWORD}
        volumes:
            - ebooks:/config
        ports:
            - 8080:8080
            - 8081:8081
        restart: unless-stopped
        labels:
            - traefik.enable=true
            - traefik.http.routers.calibre.rule=Host(`calibre.internal.mikeage.net`)
            - traefik.http.services.calibre.loadbalancer.server.port=8080
volumes:
    ebooks:
        driver: local
        driver_opts:
            type: nfs
            o: addr=openmediavault.lan,nfsvers=4.2,soft,timeo=600,retrans=2,rsize=1048576,wsize=1048576
            device: :/storage/media/ebooks
