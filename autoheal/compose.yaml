---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:2a12edd57ae929fa62452385bd89f5ac528988a1b7bc7860e625659292a8cc8c
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
