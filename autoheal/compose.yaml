---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:ef21f7da2ffee62dec2e2e2e9e75173f031dfe66f5195ac69d1e223542bb8853
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
