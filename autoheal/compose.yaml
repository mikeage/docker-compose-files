---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:1c00ddf723629daf91a70f2f8c74500db4e4ac1b3c27d2e7b610dced267511f5
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
