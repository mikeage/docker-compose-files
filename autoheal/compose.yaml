---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:d4b6faccf496c84fd6eb48395c2e226c26c91a0bfbfe82d84da8e8591dc3cc2e
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
