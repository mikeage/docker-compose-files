---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:2050a9dabe237a16fc3679ee446b8043f9fd59e161198bdb0ec9c10c1f48375d
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
