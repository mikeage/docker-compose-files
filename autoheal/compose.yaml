---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:c3986115f239b4dbb04736cbd846d6d964054dc344ff05f65ec71db3cdd7f4a5
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
