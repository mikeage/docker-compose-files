---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:bc9aac4115621598adfb75877ab42051ab06f35d46459237a3393a50b0c4278c
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
