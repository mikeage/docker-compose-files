---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:5b12e3531bd88da2c307f8c607818629fab42943c2f2955560fbdc6e2a73b957
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
