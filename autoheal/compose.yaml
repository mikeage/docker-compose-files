---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:d6c8f67e0b3323205db73901a8ea8a00053aee57bfc59a581da3e212d8ba304a
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
