---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:b3992e3efc554ace9e7adde8d8bce6960df2e3778a8592099b34e1a1f3cf11e2
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
