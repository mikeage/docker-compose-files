---
services:
    broker:
        image: redis:8@sha256:2838d5524559494f6f1cd66e97e76b200d64a633a8614200620755ed395daf32
        restart: unless-stopped
        healthcheck:
            test: [CMD, redis-cli, ping]
            start_period: 5s
            interval: 10s
            timeout: 5s
            retries: 5
        environment:
            - TZ=Asia/Jerusalem
        volumes:
            - redis_data:/data
    mariadb:
        image: mariadb:12@sha256:f2edccc553e049f6efc6fd34854022f39a3fd3f82eab26a40edc8b565e208c63
        restart: unless-stopped
        healthcheck:
            test: [CMD-SHELL, mariadb-admin ping -h 127.0.0.1 -u"$$MARIADB_USER" -p"$$MARIADB_PASSWORD" --silent]
            start_period: 20s
            interval: 10s
            timeout: 5s
            retries: 6
        volumes:
            - db_data:/var/lib/mysql
        environment:
            MARIADB_DATABASE: ${DB_NAME}
            MARIADB_USER: ${DB_USER}
            MARIADB_PASSWORD: ${DB_PASSWORD}
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            TZ: Asia/Jerusalem
    webserver:
        image: ghcr.io/paperless-ngx/paperless-ngx:2.20.15@sha256:6c86cad803970ea782683a8e80e7403444c5bf3cf70de63b4d3c8e87500db92f
        restart: unless-stopped
        depends_on:
            mariadb:
                condition: service_healthy
            broker:
                condition: service_healthy
            gotenberg:
                condition: service_healthy
            tika:
                condition: service_healthy
        ports:
            - 8028:8000
        healthcheck:
            test: [CMD, curl, -f, http://localhost:8000]
            start_period: 120s
            interval: 30s
            timeout: 10s
            retries: 5
        volumes:
            - paperless_data:/usr/src/paperless/data
            - paperless-ngx-lindy-media:/usr/src/paperless/media
            - type: tmpfs
              target: /usr/src/paperless/export
            - type: tmpfs
              target: /usr/src/paperless/consume
        environment:
            PAPERLESS_REDIS: redis://broker:6379
            PAPERLESS_DBENGINE: mariadb
            PAPERLESS_DBHOST: mariadb
            PAPERLESS_URL: https://paperless-ngx-lindy.internal.mikeage.net
            PAPERLESS_DBPORT: 3306
            PAPERLESS_ADMIN_USER: ${PAPERLESS_USER}
            PAPERLESS_ADMIN_EMAIL: paperlessadmin-lindy@mikeage.net
            PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_PASSWORD}
            PAPERLESS_TIKA_ENABLED: 1
            PAPERLESS_OCR_LANGUAGE: heb+eng
            PAPERLESS_OCR_LANGUAGES: heb
            PAPERLESS_FILENAME_FORMAT: '{{ correspondent }}/{{ created_year }}/{{ title }}'
            PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
            PAPERLESS_TIKA_ENDPOINT: http://tika:9998
            PAPERLESS_OCR_USER_ARGS: '{"invalidate_digital_signatures": true, "continue_on_soft_render_error": true}'
            TZ: Asia/Jerusalem
        labels:
            - traefik.enable=true
            - traefik.http.routers.paperless-ngx-lindy.rule=Host(`paperless-ngx-lindy.internal.mikeage.net`)

    gotenberg:
        image: docker.io/gotenberg/gotenberg:8.27@sha256:d71ab8c13b6bd47c7bc81195082005dfb17eaa75e8b1fadd347a64ee66ed98d5
        restart: unless-stopped
        healthcheck:
            test: [CMD-SHELL, "curl --fail localhost:3000/health | grep '\"status\":\"up\",\"details\"'"]
            start_period: 20s
            interval: 30s
            timeout: 5s
            retries: 5
        environment:
            CHROMIUM_DISABLE_ROUTES: 1
            TZ: Asia/Jerusalem
        command:
            - gotenberg
            - --chromium-disable-javascript=true
            - --chromium-allow-list=file:///tmp/.*
    tika:
        image: docker.io/apache/tika:3.3.0.0@sha256:2a565f1ea1290bdcb74a7d35957d16a989ed44ef98790dcdcc28121d728fa583
        restart: unless-stopped
        healthcheck:
            test: [CMD-SHELL, "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9998; printf \"GET / HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\\
                      n\" >&3; grep -Eq \"HTTP/1\\\\.[01] 200\" <&3'"]
            start_period: 20s
            interval: 30s
            timeout: 5s
            retries: 5
        environment:
            - TZ=Asia/Jerusalem
volumes:
    redis_data:
    db_data:
    paperless_data:
    paperless-ngx-lindy-media:
        driver: local
        driver_opts:
            type: nfs
            o: addr=openmediavault.lan,nfsvers=4.2,soft,timeo=600,retrans=2,rsize=1048576,wsize=1048576
            device: :/storage/permanent/paperless_media.lindy
