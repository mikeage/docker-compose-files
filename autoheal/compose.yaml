---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:3aa672c8d4263d9b0a0f45364ee810a6d70f36af237585b2c5d9b29a33a91db4
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
