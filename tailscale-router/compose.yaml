---
services:
    tailscale-router:
        image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
        hostname: ${TS_HOSTNAME:?set TS_HOSTNAME}
        network_mode: host
        restart: unless-stopped
        healthcheck:
            test: [CMD, tailscale, status]
            start_period: 20s
            interval: 30s
            timeout: 10s
            retries: 5
        cap_add:
            - NET_ADMIN
            - SYS_MODULE
        volumes:
            - /dev/net/tun:/dev/net/tun
            - /opt/tailscale/data:/var/lib/tailscale
        environment:
            - TS_EXTRA_ARGS=--login-server https://headscale.mikeage.net --accept-dns=true --advertise-exit-node --advertise-routes=192.168.0.0/16
            - TS_STATE_DIR=/var/lib/tailscale
            - TZ=Asia/Jerusalem
            - TS_HOSTNAME=${TS_HOSTNAME:?set TS_HOSTNAME}
