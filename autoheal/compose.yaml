---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:36bd0166358b7d052cef1771bf3c247eb6b5489ada0be694b7e6df6436b9a718
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
