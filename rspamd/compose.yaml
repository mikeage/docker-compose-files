---
services:
    redis:
        image: redis:latest@sha256:234c902a2db49461a129e2d4aeff85b28cf20187ed274a67f6e50995fa713c7b  # https://github.com/rspamd/rspamd-docker/blob/main/examples/compose/compose.yaml
        restart: unless-stopped
        healthcheck:
            test: [CMD, redis-cli, ping]
            start_period: 5s
            interval: 10s
            timeout: 5s
            retries: 5
        volumes:
            - redis-data:/data
    rspamd:
        image: rspamd/rspamd:4.1.2@sha256:15dfe447f8913516c4ff24933a0727aff53d88bf38ef1937fb74f5152568f496
        restart: unless-stopped
        healthcheck:
            test: [CMD, rspamadm, control, stat]
            start_period: 20s
            interval: 30s
            timeout: 5s
            retries: 5
        depends_on:
            redis:
                condition: service_healthy
        ports:
            - 11332:11332
            - 11334:11334
        volumes:
            - /opt/rspamd/etc:/etc/rspamd
            - rspamd-lib:/var/lib/rspamd
        labels:
            - traefik.enable=true
            - traefik.http.routers.rspamd.rule=Host(`rspamd.internal.mikeage.net`)
            - traefik.http.services.rspamd.loadbalancer.server.port=11334

            - traefik.tcp.routers.rspamdmilter.entrypoints=rspamdmilter
            - traefik.tcp.routers.rspamdmilter.rule=HostSNI(`*`)
            - traefik.tcp.routers.rspamdmilter.service=rspamdmilter
            - traefik.tcp.services.rspamdmilter.loadbalancer.server.port=11332

volumes:
    redis-data:
    rspamd-lib:
