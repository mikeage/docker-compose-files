---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:b9c4aa01a6da5eb54ae4156b28b80b825d34f5fa292a34744685d727ad625d30
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
