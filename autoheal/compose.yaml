---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:d9a7db2f75142e7e169ec34fca536e645fb3361e5fd0f1d945ad99ad31d12d95
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
