---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:ded0301fc3e659519feef9850f19c75c67f49857c0aa4f7ff9a5ed5de942dc2f
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
