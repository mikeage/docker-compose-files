---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:f8770710e313bead24671600b91e5f5889a278ff61ac37d0ae738b22008113d7
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
