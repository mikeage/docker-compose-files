---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:8af49be76abc3292455abd4e53347e561db60d6490e00edf045a09c0e8f0fb86
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
