---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:17f16c73a81beb6f404bf00965c6b98de64b43b551d171326e2d3da12d7d66b6
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
