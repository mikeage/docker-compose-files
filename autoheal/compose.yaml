---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:b2418b25f3e3e712e182eab9dab25a6b9889842f8fe89597efffcef8651a2c6a
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
