---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:cfd35baa26927f2dd56a0cd185425bb7aba2eb116e439f3ee383538355534542
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
