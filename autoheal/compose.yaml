---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:2db3cd6c7cd730bfd6467e176ddaa4f2658e87d5a3ad95e1ec30652de023afcf
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
