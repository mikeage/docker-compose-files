---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:74c00dafa7cffc99ca48b54239bc071db1b5902267fc341d074659926ec4de69
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
