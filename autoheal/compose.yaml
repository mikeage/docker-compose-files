---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:cbc8fcb306a10bb2a79c56042c77f0f7a29fe87d827290a3f2142a3d0bed192e
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
