---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:b6f4bafdf82ae011750558f50130517807c23aa7cbb3017fcc217d3dab0914a6
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
