---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:af64ae2b6ca6a26c973e26daf9f15b08a5dcd760251d8bbbc6b957ddad08f48d
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
