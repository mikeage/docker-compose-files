---
services:
    seerr:
        image: ghcr.io/seerr-team/seerr:v3.5.1@sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be
        init: true
        environment:
            - LOG_LEVEL=debug
            - TZ=Asia/Jerusalem
        ports:
            - 5055:5055
        volumes:
            - /opt/seerr/config:/app/config
        healthcheck:
            test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
            start_period: 20s
            timeout: 3s
            interval: 15s
            retries: 3
        restart: unless-stopped
        labels:
            - traefik.enable=true
            - traefik.http.routers.seerr.rule=Host(`seerr.internal.mikeage.net`)
