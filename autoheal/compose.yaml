---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:3c195f2627e188237100075883be3c376e028cf851e9930e6a888304f18f25a7
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
