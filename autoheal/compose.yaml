---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:1f32fd55c7458717d7b528dbd526ddde454e8d4947f6f7486b15aa8103545fb7
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
