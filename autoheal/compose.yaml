---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:d33b9167f39854d937b5deb854b4ab3d16b823976a3abf4c2c4a143ebb32eb7e
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
