---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:b1a1d5323c8e69eaea7118374ea85cbe5a62713719145869a6bef224ffef5c0f
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
