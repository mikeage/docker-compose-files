---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:2d74879a5c8d47cb5dbb3577aebe4fe8cea44d8ec2db8aabdd256d588d24c6d6
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
