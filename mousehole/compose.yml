---
services:
    mousehole:
        image: tmmrtn/mousehole:latest@sha256:2fc02b12362581e60bfd6adba788bda9eda93f8f31ed089581eeabcee4518b0d
        environment:
            TZ: Asia/Jerusalem
            MOUSEHOLE_AUTH_PASSWORD: ${PASSWORD}
            MOUSEHOLE_ALLOWED_HOSTS: localhost,127.0.0.1,mousehole.internal.mikeage.net
            MOUSEHOLE_ALLOWED_ORIGINS: http://localhost:5010,http://127.0.0.1:5010,https://mousehole.internal.mikeage.net
        ports:
            - 5010:5010
        volumes:
            - mousehole:/var/lib/mousehole
        restart: unless-stopped
        labels:
            - traefik.enable=true
            - traefik.http.routers.mousehole.rule=Host(`mousehole.internal.mikeage.net`)

volumes:
    mousehole:
