---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:82dfd76bbe7da38bfbd8b52385186233211c0548aa44828dff668629702e643d
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
