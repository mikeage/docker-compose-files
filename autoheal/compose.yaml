---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:a32dfc9bfbd4beb0d467e406d4ee6786765e7544552670189383408ece4f3abe
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
