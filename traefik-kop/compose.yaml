---
services:
    traefik-kop:
        image: ghcr.io/jittering/traefik-kop:0.21@sha256:ba7595e054e1d1831f17a3cd4e016e802ce9923a7f9843eb8f66dc5010469740
        restart: unless-stopped
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        environment:
            - REDIS_ADDR=redis.lan:6379
            - BIND_IP=${HOSTNAME}
            - REDIS_PASS=${REDIS_PASS}
            - TZ=Asia/Jerusalem
