---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:5c714bcf53e70c24329060b85477623cc2a0b05a065095c04785e0afb179c8be
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
