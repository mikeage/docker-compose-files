---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:ed2dc42f4e0534fecdfd8c11b6b6f3a359c6e783fe1b3e60d62f5ee683f450df
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
