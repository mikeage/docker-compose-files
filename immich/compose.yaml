---
name: immich

services:
    immich-server:
        container_name: immich_server
        image: ghcr.io/immich-app/immich-server:v3.4.1@sha256:7c489add298fc2f92cda4c777de6462aa206877e04087b815f62c7664af0b53b
        volumes:
            - /export/storage/permanent/immich-library:/data
            - /export/storage/permanent/pictures:/pictures:ro
            - /etc/localtime:/etc/localtime:ro
        environment:
            TZ: Asia/Jerusalem
            DB_PASSWORD: ${DB_PASSWORD}
        ports:
            - 2283:2283
        depends_on:
            - redis
            - database
        restart: always
        healthcheck:
            disable: false
        devices:
            - /dev/dri:/dev/dri

    immich-machine-learning:
        container_name: immich_machine_learning
        image: ghcr.io/immich-app/immich-machine-learning:v3.4.1-openvino@sha256:97f60b06c5938c326d3ba416bcf24bc94d233f34554c05f3b76336f98ffd5ea9
        volumes:
            - model-cache:/cache
        restart: always
        healthcheck:
            disable: false
        device_cgroup_rules:
            - c 189:* rmw
        devices:
            - /dev/dri:/dev/dri

    redis:
        container_name: immich_redis
        image: docker.io/valkey/valkey:9@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
        healthcheck:
            test: redis-cli ping || exit 1
        restart: always

    database:
        container_name: immich_postgres
        image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
        environment:
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_USER: postgres
            POSTGRES_DB: immich
            POSTGRES_INITDB_ARGS: --data-checksums
            DB_STORAGE_TYPE: HDD
        volumes:
            - /opt/immich/postgres:/var/lib/postgresql/data
        shm_size: 128mb
        restart: always
        healthcheck:
            disable: false

volumes:
    model-cache:
