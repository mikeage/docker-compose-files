---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:b44413bd16c784a2bb33e410186ce72f44ed39737ec834517458318a78e13dd9
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
