---
services:
    rsyslog-dockerlogs:
        image: rsyslog/rsyslog-dockerlogs:latest@sha256:0be00ab771b067c1db8d01cdb5e630f26e68b1348388e33552beb3bf5ca95326
        restart: unless-stopped
        environment:
            REMOTE_SERVER_NAME: logcollector.lan # your collector
            REMOTE_SERVER_PORT: '514'
            RSYSLOG_HOSTNAME: ${HOSTNAME}    # or hardcode
      # Optional: include stderr too (enabled by default); add filters via labels later
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        healthcheck:
            test: [CMD-SHELL, test -S /var/run/docker.sock && rsyslogd -N1]
            start_period: 15s
            interval: 30s
            timeout: 5s
            retries: 3
