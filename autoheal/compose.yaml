---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:5ec1688a88167d9f4fd1e9acce7ab1e10b22786a40744d4aa00b2f88ac3d2ef8
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
