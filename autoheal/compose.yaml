---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:b5d0687608219cf72a3713ca43f57bb1c6575d9310d153ff0ec87e79854a470e
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
