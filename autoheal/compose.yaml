---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:dde994c77d1bf7e8457d6d560d9a06d46a59d21bef537afc45dbaf3cd71f330c
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
