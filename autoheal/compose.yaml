---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:5fac5c11ae48047ee09e2c838f0fcc0d62289cb14a891b93b265e9227a743740
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
