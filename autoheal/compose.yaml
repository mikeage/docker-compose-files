---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:4313c6bf631e79801165718769bcbb48ffbbfb8b549e5738f5f12fee2f963e5c
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
