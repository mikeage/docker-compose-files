---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:030f9ffcdf9891ae4a1562d490c2594f880a6c7c84f4823a28e3dc2e0173b53b
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
