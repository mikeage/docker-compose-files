---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:fb32c57e2a62bfa2e0b882a2ae544a8edd642025cef1647cb8cba564ac84adb8
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
