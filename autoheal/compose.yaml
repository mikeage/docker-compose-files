---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:ed613b69c02859f6095e7eb5c34bb8e52d9db50b892bef1d3544b41dbdbe5996
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
