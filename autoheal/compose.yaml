---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:b3f2443e9ab5e9baabe4fa139a6cf3582c52bf85cf9bbd7c637ceb5336e44dcb
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
