---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:4a55944559300808db6f5cfee85e0072f1d90423724043641354ea3657e696c8
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
