---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:6a8009a2357c8a1d72817be879012938993fb3ac4f066a2eaccf208584d21a93
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
