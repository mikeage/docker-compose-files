---
services:
    redis:
        image: redis:latest@sha256:0a972391db0b24ec336e35d1bc98b237237e26f82bf5120cf2f6b1688d1df973  # https://github.com/rspamd/rspamd-docker/blob/main/examples/compose/compose.yaml
        restart: unless-stopped
        healthcheck:
            test: [CMD, redis-cli, ping]
            start_period: 5s
            interval: 10s
            timeout: 5s
            retries: 5
        volumes:
            - redis-data:/data
    rspamd:
        image: rspamd/rspamd:4.1.0@sha256:723e713d1cbc56fe753fff2d5815352787fec20403568fd1d9a8973548410475
        restart: unless-stopped
        healthcheck:
            test: [CMD, rspamadm, control, stat]
            start_period: 20s
            interval: 30s
            timeout: 5s
            retries: 5
        depends_on:
            redis:
                condition: service_healthy
        ports:
            - 11332:11332
            - 11334:11334
        volumes:
            - /opt/rspamd/etc:/etc/rspamd
            - rspamd-lib:/var/lib/rspamd
        labels:
            - traefik.enable=true
            - traefik.http.routers.rspamd.rule=Host(`rspamd.internal.mikeage.net`)
            - traefik.http.services.rspamd.loadbalancer.server.port=11334

            - traefik.tcp.routers.rspamdmilter.entrypoints=rspamdmilter
            - traefik.tcp.routers.rspamdmilter.rule=HostSNI(`*`)
            - traefik.tcp.routers.rspamdmilter.service=rspamdmilter
            - traefik.tcp.services.rspamdmilter.loadbalancer.server.port=11332

volumes:
    redis-data:
    rspamd-lib:
