---
services:
    traefik-kop:
        image: ghcr.io/jittering/traefik-kop:0.20@sha256:47fe0d357acd0b0ac0e877c14f389745d7406f60783f2afc6d1848e36566d20e
        restart: unless-stopped
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        environment:
            - REDIS_ADDR=redis.lan:6379
            - BIND_IP=${HOSTNAME}
            - REDIS_PASS=${REDIS_PASS}
            - TZ=Asia/Jerusalem
