---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:ad53db0ffdb59c97d1e0035352af270511305b5f58e17e05aab6e592a6927456
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
