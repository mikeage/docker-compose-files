---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:34b85a4df5d0fa917f70375680541e9f4d53f564429446da210111dde35e8101
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
