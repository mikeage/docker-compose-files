---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:3b1bb5104b6157076a47865544f5e0dc6897630ee3aa477c2928e2cbe0378ba5
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
