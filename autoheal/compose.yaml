---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:234413eaa9a585978f6cb2d35f0dcdeb70fc4dadbaa3d7230197dd17e97125fb
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
