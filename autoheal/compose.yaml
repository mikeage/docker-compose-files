---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:2f64883fdf5e817440e04ba505303370bd7d892d9167f8764904ba9b574f9cfc
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
