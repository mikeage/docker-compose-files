---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:c4087f1909384e4bb4668a3f603440e4fd42ecbc8c5e2ab7ee790b56863e94da
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
