---
services:
    redis:
        image: redis:latest@sha256:9c5c616b6e72ea6e38125bb9b12eac2dcd92cd57f8f811ee2fb965ae4cb0f16e  # https://github.com/rspamd/rspamd-docker/blob/main/examples/compose/compose.yaml
        restart: unless-stopped
        healthcheck:
            test: [CMD, redis-cli, ping]
            start_period: 5s
            interval: 10s
            timeout: 5s
            retries: 5
        volumes:
            - redis-data:/data
    rspamd:
        image: rspamd/rspamd:4.1.5@sha256:c307774c4c83bc445f0ae6696fd1798c92b0b89355ae1d87c9c39694c875e51e
        restart: unless-stopped
        healthcheck:
            test: [CMD, rspamadm, control, stat]
            start_period: 20s
            interval: 30s
            timeout: 5s
            retries: 5
        depends_on:
            redis:
                condition: service_healthy
        ports:
            - 11332:11332
            - 11334:11334
        volumes:
            - /opt/rspamd/etc:/etc/rspamd
            - rspamd-lib:/var/lib/rspamd
        labels:
            - traefik.enable=true
            - traefik.http.routers.rspamd.rule=Host(`rspamd.internal.mikeage.net`)
            - traefik.http.services.rspamd.loadbalancer.server.port=11334

            - traefik.tcp.routers.rspamdmilter.entrypoints=rspamdmilter
            - traefik.tcp.routers.rspamdmilter.rule=HostSNI(`*`)
            - traefik.tcp.routers.rspamdmilter.service=rspamdmilter
            - traefik.tcp.services.rspamdmilter.loadbalancer.server.port=11332

volumes:
    redis-data:
    rspamd-lib:
