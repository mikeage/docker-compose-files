---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:147ed822bf5f787f638687c66bb3591b64d73fc4a1640da64c5442608d139878
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
