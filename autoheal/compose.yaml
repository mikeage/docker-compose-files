---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:fe88c69806c71ac82fd3a483596011742f5ef319f84744cc3128e5b92b10af77
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
