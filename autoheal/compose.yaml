---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:347057301b079cfd4322cfbe4efd2608a1914c369317b0872cb501c7b10a35de
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
