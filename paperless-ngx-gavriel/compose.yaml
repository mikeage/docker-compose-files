---
services:
    broker:
        image: docker.io/valkey/valkey:9-alpine@sha256:ccfa19b0d743e48927e1c8c14e39e0acb97b5cea347fef0bfe340247fea920cd
        restart: unless-stopped
        healthcheck:
            test: [CMD, redis-cli, ping]
            start_period: 5s
            interval: 10s
            timeout: 5s
            retries: 5
        environment:
            - TZ=Asia/Jerusalem
        volumes:
            - redis_data:/data
    mariadb:
        image: mariadb:12@sha256:dd9b303aed4f4890ed09f766d8ca9ddfd176c0c6f6267feff53b3192ec65a979
        restart: unless-stopped
        healthcheck:
            test: [CMD-SHELL, mariadb-admin ping -h 127.0.0.1 -u"$$MARIADB_USER" -p"$$MARIADB_PASSWORD" --silent]
            start_period: 20s
            interval: 10s
            timeout: 5s
            retries: 6
        volumes:
            - db_data:/var/lib/mysql
        environment:
            MARIADB_DATABASE: ${DB_NAME}
            MARIADB_USER: ${DB_USER}
            MARIADB_PASSWORD: ${DB_PASSWORD}
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            TZ: Asia/Jerusalem
    webserver:
        image: ghcr.io/paperless-ngx/paperless-ngx:3.1.2@sha256:5ab4f4f9bb099a36bec3e092906ea3e611323c5f18dc5cc38c76a1d540bdca9c
        restart: unless-stopped
        depends_on:
            mariadb:
                condition: service_healthy
            broker:
                condition: service_healthy
            gotenberg:
                condition: service_healthy
            tika:
                condition: service_healthy
        ports:
            - 8018:8000
        healthcheck:
            test: [CMD, curl, -f, http://localhost:8000]
            start_period: 300s
            interval: 30s
            timeout: 10s
            retries: 5
        volumes:
            - paperless_data:/usr/src/paperless/data
            - paperless-ngx-gavriel-media:/usr/src/paperless/media
            - type: tmpfs
              target: /usr/src/paperless/export
            - type: tmpfs
              target: /usr/src/paperless/consume
        environment:
            PAPERLESS_REDIS: redis://broker:6379
            PAPERLESS_DBENGINE: mariadb
            PAPERLESS_DBHOST: mariadb
            PAPERLESS_URL: https://paperless-ngx.gavriel.mikeage.net
            PAPERLESS_DBPORT: 3306
            PAPERLESS_ADMIN_USER: ${PAPERLESS_USER}
            PAPERLESS_ADMIN_EMAIL: paperlessadmin-gavriel@mikeage.net
            PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_PASSWORD}
            PAPERLESS_TIKA_ENABLED: 1
            PAPERLESS_OCR_LANGUAGE: heb+eng
            PAPERLESS_OCR_LANGUAGES: heb
            PAPERLESS_FILENAME_FORMAT: '{{ correspondent }}/{{ created_year }}/{{ title }}'
            PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
            PAPERLESS_TIKA_ENDPOINT: http://tika:9998
            PAPERLESS_OCR_USER_ARGS: '{"invalidate_digital_signatures": true}'
            PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
            TZ: Asia/Jerusalem
        labels:
            - traefik.enable=true
            - traefik.http.routers.paperless-ngx-gavriel.rule=Host(`paperless-ngx.gavriel.mikeage.net`)

    gotenberg:
        image: docker.io/gotenberg/gotenberg:8.34@sha256:67097317623a503ba2a6a7e9ae8db6929a1f7e1bbd88077bacf2d325fbdab923
        restart: unless-stopped
        healthcheck:
            test: [CMD-SHELL, "curl --fail localhost:3000/health | grep '\"status\":\"up\",\"details\"'"]
            start_period: 20s
            interval: 30s
            timeout: 5s
            retries: 5
        environment:
            CHROMIUM_DISABLE_ROUTES: 1
            TZ: Asia/Jerusalem
        command:
            - gotenberg
            - --chromium-disable-javascript=true
            - --chromium-allow-list=file:///tmp/.*
    tika:
        image: docker.io/apache/tika:3.3.1.0@sha256:90b7fa1dc018434075fce9e1d9b88b1e3d0ea6979d0cf86e116c79a8073ae973
        restart: unless-stopped
        healthcheck:
            test: [CMD-SHELL, "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9998; printf \"GET / HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\\
                      n\" >&3; grep -Eq \"HTTP/1\\\\.[01] 200\" <&3'"]
            start_period: 20s
            interval: 30s
            timeout: 5s
            retries: 5
        environment:
            - TZ=Asia/Jerusalem
volumes:
    redis_data:
    db_data:
    paperless_data:
    paperless-ngx-gavriel-media:
        driver: local
        driver_opts:
            type: nfs
            o: addr=openmediavault.lan,nfsvers=4.2,soft,timeo=600,retrans=2,rsize=1048576,wsize=1048576
            device: :/storage/permanent/paperless_media.gavriel
