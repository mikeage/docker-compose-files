---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:629748b4a5a292594634aa32642d764dcb4adb5e8ad18ef572d4e9ff95966754
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
