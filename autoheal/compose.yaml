---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:dbed02708ea6277df18ddf35a21b307c732d72eacf44c79a698975f1b11a8745
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
