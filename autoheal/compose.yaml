---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:22b7d63a9d1419de3fc8645c658d63bfb61b8c5de14763f87fe2f5397ae42f3e
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
