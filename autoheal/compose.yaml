---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:dca1ad173d3172d472ead050c5fb6cacfb7e38dc3141c19506ad072fb2380958
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
