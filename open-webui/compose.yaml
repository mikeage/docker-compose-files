---
services:
    openwebui:
        restart: unless-stopped
        image: ghcr.io/open-webui/open-webui:main@sha256:c792953395b43d4f49085fa4026850c5e923578345ebeaf56eabd980bcfc273a
        ports:
            - 3006:8080
        volumes:
            - /opt/open-webui/data:/app/backend/data
        labels:
            - traefik.enable=true
            - traefik.http.routers.open-webui.rule=Host(`open-webui.internal.mikeage.net`)
