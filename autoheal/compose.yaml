---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:eb5960e1e693c2d019ac537404f4429a960eecca3d3c9c3296a1a0a2e60c5280
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
