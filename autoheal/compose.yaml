---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:bc95f0cda4668c58c26169b09ee06f49415f06e1b6ac88853292042041659c84
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
