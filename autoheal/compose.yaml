---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:9e55551fa5b4d082f40effefcdb27d9f400a4e43f11e3acf05a068a32457ca5c
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
