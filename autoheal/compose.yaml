---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:e17705caa7c6314b74e6449016c16fd36bf135bec409594090f1296a71d62c7b
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
