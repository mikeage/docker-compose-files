---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:2c06b888d85ec746edea45db6ebb5570d483166eece31f69f5eef8fec9405158
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
