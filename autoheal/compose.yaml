---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:9f06d39d4ae9e215774b96a979007cc8e492d64d1bb9992ca035cb478b972a8a
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
