---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:0b973869d2b60c2281f11b2360879104cfaa6fc30cd8d63789b99d4f3934c91c
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
