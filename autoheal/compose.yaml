---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:cdb6271bea1fedd140e0629c01248a5712591032c424185e578b336791a4534d
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
