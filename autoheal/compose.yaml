---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:3795efdfe41bce0de8c2c7a09523dd9a5bb24cc326a693dd12eec65c5be13b8e
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
