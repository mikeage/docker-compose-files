---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:1f05fc7fabb8ea716c8acd6d43bf286be0028ae6f18e21df9320c570b8ba8a18
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
