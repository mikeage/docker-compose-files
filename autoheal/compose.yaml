---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:65dc93e768bd312be60c36ab58c59cf92dec0c2e556ea2f3fc6faee06e84815f
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
