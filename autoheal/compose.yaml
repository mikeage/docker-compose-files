---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:b9b7a5e7803dad0aa12b0ffd05aece796f1ea0ac65595705da847d3438121112
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
