---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:2ab69befc6f46c9b93f3e6167a4980ad90c0b409ebc2615a2859568f0442128b
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
