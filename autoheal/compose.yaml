---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:98bc42cef5dedd7ccfb7feab4464a6f938ee305187b64709e915df321efe69b0
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
