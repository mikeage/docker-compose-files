---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:9e8b0a0def3d382bcaf0e1938f3ef239aeb757f667fa360f90ffff9e33997202
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
