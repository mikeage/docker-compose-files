---
services:
    traefik-kop:
        image: ghcr.io/jittering/traefik-kop:0.20@sha256:f4919330407ae93f6d966cff7d7352198c09ed5e788c959a1bfd9d0eaf7e1091
        restart: unless-stopped
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        environment:
            - REDIS_ADDR=redis.lan:6379
            - BIND_IP=${HOSTNAME}
            - REDIS_PASS=${REDIS_PASS}
            - TZ=Asia/Jerusalem
