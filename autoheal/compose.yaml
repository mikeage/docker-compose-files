---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:4a589e669865c96564e4f8b2f9fc092dfa5b5c96d45efe2465e063fbeeb72011
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
