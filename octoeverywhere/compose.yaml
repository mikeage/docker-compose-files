---
services:
    a1mini:
        restart: unless-stopped
        image: octoeverywhere/octoeverywhere:5.3.5@sha256:d2871d126e5e3519f8296e0039f7fa76a8bed23db336aadf8c75106959602fbf
        environment:
            - ACCESS_CODE=39994545
            - SERIAL_NUMBER=0309DA462001807
            - PRINTER_IP=a1mini.lan
            - TZ=Asia/Jerusalem
        volumes:
            - /opt/octoeverywhere/a1mini:/data
        healthcheck:
            test: [CMD-SHELL, test -w /data && test -d /data/octoeverywhere-store && test -d /data/logs]
            start_period: 30s
            interval: 30s
            timeout: 5s
            retries: 3
