---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:e6aa87eb1bf76999d60e7b251586c894c4c1b1320f7fcc017708f69bc42b30c7
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
