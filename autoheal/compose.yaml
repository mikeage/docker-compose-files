---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:5b232c5aee716d0f23176b7f26d8ae841bf50074ccf851072c33f13e6125f216
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
