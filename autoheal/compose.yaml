---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:a02255b0d86d6f056cf75943b9e2fe7f82f74ededc112d310de097f6cc22880c
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
