---
name: immich

services:
    immich-server:
        container_name: immich_server
        image: ghcr.io/immich-app/immich-server:v3.2.2@sha256:79cc1623323d5894922686d8743b4780181428f98eecbfb58ce12c41ef02d1ea
        volumes:
            - /export/storage/permanent/immich-library:/data
            - /export/storage/permanent/pictures:/pictures:ro
            - /etc/localtime:/etc/localtime:ro
        environment:
            TZ: Asia/Jerusalem
            DB_PASSWORD: ${DB_PASSWORD}
        ports:
            - 2283:2283
        depends_on:
            - redis
            - database
        restart: always
        healthcheck:
            disable: false
        devices:
            - /dev/dri:/dev/dri

    immich-machine-learning:
        container_name: immich_machine_learning
        image: ghcr.io/immich-app/immich-machine-learning:v3.2.2-openvino@sha256:4013ec28ccf6344d7ae24554743a116d7f61124b98858f5646a401d5c5df12e2
        volumes:
            - model-cache:/cache
        restart: always
        healthcheck:
            disable: false
        device_cgroup_rules:
            - c 189:* rmw
        devices:
            - /dev/dri:/dev/dri

    redis:
        container_name: immich_redis
        image: docker.io/valkey/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
        healthcheck:
            test: redis-cli ping || exit 1
        restart: always

    database:
        container_name: immich_postgres
        image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
        environment:
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_USER: postgres
            POSTGRES_DB: immich
            POSTGRES_INITDB_ARGS: --data-checksums
            DB_STORAGE_TYPE: HDD
        volumes:
            - /opt/immich/postgres:/var/lib/postgresql/data
        shm_size: 128mb
        restart: always
        healthcheck:
            disable: false

volumes:
    model-cache:
