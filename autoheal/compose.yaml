---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:5f077e5495050173bab5a696e5d4784c6a925cb90e8e0eccf22df62222b9b0b9
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
