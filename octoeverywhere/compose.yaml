---
services:
    a1mini:
        restart: unless-stopped
        image: octoeverywhere/octoeverywhere:4.6.10@sha256:c20b9e1d28f69d3a0d278902410150c1905d96049df58c32e0b80eea1570aee1
        environment:
            - ACCESS_CODE=39994545
            - SERIAL_NUMBER=0309DA462001807
            - PRINTER_IP=a1mini.lan
            - TZ=Asia/Jerusalem
        volumes:
            - /opt/octoeverywhere/a1mini:/data
        healthcheck:
            test: [CMD-SHELL, test -w /data && test -d /data/octoeverywhere-store && test -d /data/logs]
            start_period: 30s
            interval: 30s
            timeout: 5s
            retries: 3
