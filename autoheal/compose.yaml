---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:e50aef1dd3cf7ba053bda7bb6910af7804e34600c4677b8d07d29367270ab771
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
