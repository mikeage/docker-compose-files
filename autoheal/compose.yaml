---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:66e2b5ec0e7e9b9dd5b978752deb7b1015573a842e4d562531941ba0bafd9f92
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
