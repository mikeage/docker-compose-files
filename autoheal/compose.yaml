---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:1f4ca40fdf577381ae1292920bc1af39c1755939a2ecc0aedbe7b1eccdaa63f4
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
