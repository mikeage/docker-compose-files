---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:9a2fb22a454e3ce82dd88c99ebf98e86ceab082a415446d0be40e84bec170fad
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
