---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:8654671643436bb18bfb3f6c5e05af04926ce96b063d5a930a93e60246423c97
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
