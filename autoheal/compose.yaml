---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:9f7e586dc0c567c8020070424b991afb09fa6f596b7ba3e30266aa6d0f5c7e12
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
