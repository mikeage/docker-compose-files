---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:8215bc8d5e2f4e67546347bd435f889c71abd77750751bb5c7826ec7e3ea89a2
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
