---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:14c1082b1149217d7c5b0a1edaa97a383aa44c4f94389f7951b2e3a728fabbfd
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
