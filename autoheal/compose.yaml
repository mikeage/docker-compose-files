---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:da6bb5ed312b53150ff31adaf632c01e9cde313cfc786159687445280191366f
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
