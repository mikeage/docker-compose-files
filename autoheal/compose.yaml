---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:6682d06f6ff54df5a9f9bfcce9256f0d51a9b0e410dc548fe1e437701da441b1
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
