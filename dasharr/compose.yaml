---
services:
    db:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        restart: unless-stopped
        shm_size: 128mb
        volumes:
            - /opt/dasharr/db:/var/lib/postgresql/
        env_file:
            - .env
        healthcheck:
            test: [CMD-SHELL, pg_isready -U dasharr]
            interval: 5s
            timeout: 5s
            retries: 5

    dasharr:
        image: ghcr.io/arcadia-solutions/dasharr:latest@sha256:190a6f1c0ebb05f91619831bc75074266541e619aac09863eeb4ee41e9b32a51
        restart: unless-stopped
        healthcheck:
            test: [CMD-SHELL, curl --fail --silent --show-error http://127.0.0.1/swagger-json/openapi.json > /dev/null]
            start_period: 10s
            interval: 30s
            timeout: 5s
            retries: 5
        ports:
            - 3002:80
        environment:
            - ENV=Docker
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
        labels:
            - traefik.enable=true
            - traefik.http.routers.dasharr.rule=Host(`dasharr.internal.mikeage.net`)
