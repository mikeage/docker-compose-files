---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:a2b3ac4932720b1a884e1c54dfd61f043a875ff34b513f0b1205bc1079df6ce0
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
