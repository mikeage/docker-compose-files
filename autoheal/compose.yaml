---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:658d4db0d5d570d07f1977e6cd344d5d9789f4453a050abf784caa330458ab26
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
