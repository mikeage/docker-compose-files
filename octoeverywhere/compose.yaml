---
services:
    a1mini:
        restart: unless-stopped
        image: octoeverywhere/octoeverywhere:5.3.0@sha256:891995b72071859120a5cfaa0c258038a77cc1dcccbe24875b58ca29f066cfe9
        environment:
            - ACCESS_CODE=39994545
            - SERIAL_NUMBER=0309DA462001807
            - PRINTER_IP=a1mini.lan
            - TZ=Asia/Jerusalem
        volumes:
            - /opt/octoeverywhere/a1mini:/data
        healthcheck:
            test: [CMD-SHELL, test -w /data && test -d /data/octoeverywhere-store && test -d /data/logs]
            start_period: 30s
            interval: 30s
            timeout: 5s
            retries: 3
