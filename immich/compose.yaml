---
name: immich

services:
    immich-server:
        container_name: immich_server
        image: ghcr.io/immich-app/immich-server:v3.3.1@sha256:db996e352359771c6a3db121a0ed8761516b22f727fc092a0f46dcfef82c1bc1
        volumes:
            - /export/storage/permanent/immich-library:/data
            - /export/storage/permanent/pictures:/pictures:ro
            - /etc/localtime:/etc/localtime:ro
        environment:
            TZ: Asia/Jerusalem
            DB_PASSWORD: ${DB_PASSWORD}
        ports:
            - 2283:2283
        depends_on:
            - redis
            - database
        restart: always
        healthcheck:
            disable: false
        devices:
            - /dev/dri:/dev/dri

    immich-machine-learning:
        container_name: immich_machine_learning
        image: ghcr.io/immich-app/immich-machine-learning:v3.3.1-openvino@sha256:9f5ea923b763435592280e2f5e051a62f1a33d6d14e87620fc15453c27a12ae0
        volumes:
            - model-cache:/cache
        restart: always
        healthcheck:
            disable: false
        device_cgroup_rules:
            - c 189:* rmw
        devices:
            - /dev/dri:/dev/dri

    redis:
        container_name: immich_redis
        image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
        healthcheck:
            test: redis-cli ping || exit 1
        restart: always

    database:
        container_name: immich_postgres
        image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
        environment:
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_USER: postgres
            POSTGRES_DB: immich
            POSTGRES_INITDB_ARGS: --data-checksums
            DB_STORAGE_TYPE: HDD
        volumes:
            - /opt/immich/postgres:/var/lib/postgresql/data
        shm_size: 128mb
        restart: always
        healthcheck:
            disable: false

volumes:
    model-cache:
