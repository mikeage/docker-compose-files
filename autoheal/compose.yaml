---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:4ae1cb5e709a7d208d57841fc5c5928e34aca0e8ab9c6f06cb65bf6e1031f705
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
