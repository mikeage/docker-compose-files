---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:9f06ce1cd5440d479d105321d21db86bdda6aefa8e2535d9077243ce189eb06b
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
