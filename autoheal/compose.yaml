---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:79afc31d33914189ef8ef37faa2b82cd2512292834842012c1bfed1a6e0baf39
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
