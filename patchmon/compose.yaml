---
# =============================================================================
# PatchMon Docker Compose - Production
# =============================================================================
# To set up your environment, run the setup script:
#
#   bash -c "$(curl -fsSL https://raw.githubusercontent.com/PatchMon/PatchMon/refs/heads/main/docker/setup-env.sh)"
#
# This will download env.example, generate secrets, and create your .env file.
# Alternatively, copy env.example to .env and fill in the values manually.
#
# Then start PatchMon:
#
#   docker compose up -d
#
# See the PatchMon documentation for full configuration details.
# =============================================================================

name: patchmon

services:

    server:
        image: ghcr.io/patchmon/patchmon-server:latest@sha256:bee093a3ad55925aad5efa9874c5075020b65c9adb8fa412958e211aac9cd094
        restart: unless-stopped
        env_file: .env
        ports:
            - 3007:3000
        depends_on:
            database:
                condition: service_healthy
            redis:
                condition: service_healthy
            guacd:
                condition: service_healthy
    # logging:
    #   driver: "json-file"
    #   options:
    #     max-size: "10m"
    #     max-file: "3"
        labels:
            - traefik.enable=true
            - traefik.http.routers.patchmon.rule=Host(`patchmon.internal.mikeage.net`)

    database:
        image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac # https://github.com/PatchMon/PatchMon/blob/main/docker/docker-compose.yml
        restart: unless-stopped
        env_file: .env
        volumes:
            - postgres_data:/var/lib/postgresql/data
    # networks:
    #   - patchmon-internal
        healthcheck:
            test: [CMD-SHELL, 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
            interval: 3s
            timeout: 5s
            retries: 7
        # logging:
        #     driver: json-file
        #     options:
        #         max-size: 10m
        #         max-file: '3'

    redis:
        image: redis:7-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7  # https://github.com/PatchMon/PatchMon/blob/main/docker/docker-compose.yml
        restart: unless-stopped
        env_file: .env
        command: redis-server --requirepass ${REDIS_PASSWORD}
        volumes:
            - redis_data:/data
    # networks:
    #   - patchmon-internal
        healthcheck:
            test: [CMD, redis-cli, --no-auth-warning, -a, '${REDIS_PASSWORD}', ping]
            interval: 3s
            timeout: 5s
            retries: 7
    # logging:
    #   driver: "json-file"
    #   options:
    #     max-size: "10m"
    #     max-file: "3"

    guacd:
        image: guacamole/guacd:latest@sha256:73df97addac17a65e8371dc842701b605316cd35ea208e1691e7bcf67e88c202
        restart: unless-stopped
        read_only: true
        tmpfs:
            - /tmp:size=64m
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        mem_limit: 512m
        cpus: '1.0'
    # networks:
    #   - patchmon-internal
        healthcheck:
            test: [CMD-SHELL, nc -z localhost 4822 || exit 1]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s
        logging:
            driver: json-file
            options:
                max-size: 10m
                max-file: '3'

volumes:
    postgres_data:
    redis_data:

