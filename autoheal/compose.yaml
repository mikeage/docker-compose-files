---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:a85df9c3f2558ecd2f2048dcae642410a68ac531c8be537a6604d82085e4261a
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
