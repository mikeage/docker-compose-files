---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:1cd6ebc52f4c2b29e6783fdfa44cdbe68ba03ad39e3db6acfd5b7988d9c3ce3d
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
