services:
    seedboxapi:
        image: myanonamouse/seedboxapi:latest@sha256:4712ede49e8c17ca1aee4cf61a145e249ddbb9498390b469c64b0b3086628259
        restart: unless-stopped
        healthcheck:
            test:
                - CMD-SHELL
                - >-
                  grep -q mam_id /config/MAM.cookies &&
                  grep -Eq '"Success":true|Last change too recent' /tmp/MAM.output
            start_period: 15s
            interval: 30s
            timeout: 5s
            retries: 5
        user: 1000:1000
        volumes:
            - /opt/myanonamouse/config:/config
