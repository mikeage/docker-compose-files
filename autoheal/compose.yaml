---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:75c28b0020543e8eb49fe6514d012e7d2691f095dd622309d045da8647c8bb83
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
