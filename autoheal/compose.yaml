---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:7637b02acc71902982abefb6275f12dd332053f66046a38d29db567d3739d86f
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
