---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:73bd5c872cee8510aaf7d24afe6cc27f3772974c4817f73c56bdba5449531268
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
