---
services:
    a1mini:
        restart: unless-stopped
        image: octoeverywhere/octoeverywhere:5.4.0@sha256:15a0ed96f3d203df1ff0d96c23548b055549f32c8ea1533c554609f78d4d1045
        environment:
            - ACCESS_CODE=39994545
            - SERIAL_NUMBER=0309DA462001807
            - PRINTER_IP=a1mini.lan
            - TZ=Asia/Jerusalem
        volumes:
            - /opt/octoeverywhere/a1mini:/data
        healthcheck:
            test: [CMD-SHELL, test -w /data && test -d /data/octoeverywhere-store && test -d /data/logs]
            start_period: 30s
            interval: 30s
            timeout: 5s
            retries: 3
