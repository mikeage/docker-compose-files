---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:917b9dbd7434293179ebe6b4600641db40690069a23c3082c9c2ab263515380a
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
