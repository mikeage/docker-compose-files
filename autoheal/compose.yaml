---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:fed5f7a2ac719bbb4c145f42c8c89daeacf0ad179a631ee50ca7b154f1e8a489
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
