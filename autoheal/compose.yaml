---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:13312d78a3b743645e4386ce802287cd36560b1357b20684abad4ef3423c6799
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
