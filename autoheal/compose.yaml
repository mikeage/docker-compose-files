---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:124992272c11e0f1b52f607aafe6f8b6566aa6e41299d378f4b2c127f253bb46
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
