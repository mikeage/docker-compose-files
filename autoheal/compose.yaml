---
services:
    autoheal:
        image: willfarrell/autoheal:latest@sha256:d8a5e6a1ab089eebb71ea036fd29176ad0771338ce84c617a67bd61c7ae315ef
        network_mode: none
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
